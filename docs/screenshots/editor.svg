    <rect x="884" y="324" width="292" height="30" rx="10" fill="#ffffff" fill-opacity="0.08"/><text x="898" y="344">↓ Print (PNG @3x)</text>
    <rect x="884" y="362" width="292" height="30" rx="10" fill="#ffffff" fill-opacity="0.08"/><text x="898" y="382">↓ Vector (SVG)</text>
