name: Release (installers)

# Builds desktop installers. Runs on version tags or manual dispatch.
# Note: artifacts are unsigned; code-signing certs would be wired via secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      - run: pnpm build
      - name: Package
        run: pnpm --filter @excalibur/app dist
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: excalibur-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore
