name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          CI: 'true'

      - name: Build
        run: pnpm build

      - name: Lint (type-check)
        run: pnpm lint

      - name: Unit & acceptance tests
        run: pnpm test

  e2e:
    name: Electron E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      - run: pnpm build
      # Electron needs a display + sandbox tweaks in CI.
      - name: Run E2E under xvfb
        run: xvfb-run --auto-servernum pnpm e2e
        env:
          CI: 'true'
